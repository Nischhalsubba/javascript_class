name: Validate JavaScript study workspace

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify example entry points
        run: test -f index.html && test -f index_2.html && test -f indexgit.html && test -f package.json
      - name: Check JavaScript syntax
        run: find . -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
